name: Android JVM 单测诊断

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 要诊断的 JVM 测试过滤条件
        required: true
        type: string
        default: '*SecureWorkspaceFileOpsTest'
      sample_memory:
        description: 采样 JVM 测试进程的堆与常驻内存
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    name: 无签名材料的 JVM 测试诊断
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: native-ui/app/tailnet/go.sum

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 运行目标 JVM 测试
        working-directory: native-ui
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
          SAMPLE_MEMORY: ${{ inputs.sample_memory }}
        run: |
          set -euo pipefail
          if [[ "$SAMPLE_MEMORY" != true ]]; then
            ./gradlew --stacktrace :app:testSideloadDebugUnitTest --tests "$TEST_FILTER"
            exit
          fi
          mkdir -p "$RUNNER_TEMP/jvm-test-memory"
          report="$RUNNER_TEMP/jvm-test-memory/memory.txt"
          timeout 40m ./gradlew --stacktrace :app:testSideloadDebugUnitTest --tests "$TEST_FILTER" &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            {
              date -u +'%Y-%m-%dT%H:%M:%SZ'
              awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
              for pid in $(pgrep -f 'org.gradle.process.internal.worker.GradleWorkerMain' || true); do
                [[ -r "/proc/$pid/cmdline" ]] || continue
                command_line=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)
                [[ "$command_line" == *worker.org.gradle.process.internal.worker.GradleWorkerMain* ]] || continue
                printf 'pid=%s role=test-worker\n' "$pid"
                awk '/^(VmRSS|VmHWM):/' "/proc/$pid/status" || true
                jcmd "$pid" VM.flags 2>/dev/null || true
                jcmd "$pid" GC.heap_info 2>/dev/null || true
              done
            } >> "$report"
            sleep 20
          done
          wait "$build_pid"

      - name: 保留测试证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jvm-test-diagnostics-${{ github.run_attempt }}
          path: |
            native-ui/app/build/reports/tests/testSideloadDebugUnitTest/
            native-ui/app/build/test-results/testSideloadDebugUnitTest/*.xml
            ${{ runner.temp }}/jvm-test-memory/
          if-no-files-found: warn
          retention-days: 7
