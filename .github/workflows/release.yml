name: Validate or publish v0.2-beta APK

on:
  workflow_dispatch:
  push:
    tags:
      - v0.2-beta

permissions:
  contents: read

concurrency:
  group: release-v0.2-beta
  cancel-in-progress: false

jobs:
  validate-release-inputs:
    name: 校验发行输入、标签对象与提交来源
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出候选提交或已存在的发行标签
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 发行前统一校验发布状态（验证账本 + 发布说明）
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          python3 scripts/ci/validate-release-readiness.py \
            docs/release/v0.2-beta-validation.md \
            docs/release/v0.2-beta.md

      - name: 校验固定标签、发行文档、签名与来源
        env:
          GH_TOKEN: ${{ github.token }}
          NEXARA_ALLOW_UNSIGNED_ANNOTATED_TAG: ${{ vars.NEXARA_ALLOW_UNSIGNED_ANNOTATED_TAG }}
          NEXARA_RELEASE_COMMIT_SHA: ${{ vars.NEXARA_RELEASE_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          for required_document in \
            docs/release/v0.2-beta.md \
            docs/release/v0.2-beta-validation.md; do
            test -s "${required_document}" || {
              echo "::error::缺少已审阅且非空的 ${required_document}，拒绝发布。"
              exit 1
            }
          done

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "codex/md3-redesign"
            candidate_head="$(git rev-parse HEAD)"
            controlled_sha="${NEXARA_RELEASE_COMMIT_SHA:-}"
            if [[ ! "${controlled_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::候选验证要求 NEXARA_RELEASE_COMMIT_SHA 为完整 40 位提交 SHA。"
              exit 1
            fi
            test "${GITHUB_SHA}" = "${candidate_head}"
            test "${GITHUB_SHA,,}" = "${controlled_sha,,}"
            echo "候选验证模式：允许构建和冷安装签名 APK，但禁止发布。"
            exit 0
          fi

          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v0.2-beta"

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_object_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "${tag_object_type}" != "tag" ]]; then
            echo "::error::发行标签必须是 annotated 或 signed tag，拒绝 lightweight tag。"
            exit 1
          fi
          tag_object_sha="$(git rev-parse "${tag_ref}")"
          tag_target_type="$(git cat-file -p "${tag_object_sha}" | sed -n 's/^type //p')"
          tag_target_sha="$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "${tag_target_type}" != "commit" ]]; then
            echo "::error::发行标签必须直接指向 commit。"
            exit 1
          fi
          if [[ "${tag_target_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::检出提交与发行标签目标不一致。"
            exit 1
          fi
          test "${tag_target_sha}" = "${GITHUB_SHA}"

          signature_verified="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.verification.verified')"
          if [[ "${signature_verified}" != "true" ]]; then
            if [[ "${NEXARA_ALLOW_UNSIGNED_ANNOTATED_TAG:-false}" != "true" ]]; then
              echo "::error::发行标签未通过 GitHub 签名验证；默认拒绝未签名 annotated tag。"
              exit 1
            fi
            echo "::warning::仓库变量已明确批准本次使用未签名 annotated tag。"
          fi

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          reviewed_source=false
          controlled_sha="${NEXARA_RELEASE_COMMIT_SHA:-}"
          if [[ -n "${controlled_sha}" ]]; then
            if [[ ! "${controlled_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::NEXARA_RELEASE_COMMIT_SHA 必须是完整 40 位提交 SHA。"
              exit 1
            fi
            if [[ "${tag_target_sha,,}" == "${controlled_sha,,}" ]]; then
              reviewed_source=true
            fi
          fi
          for reviewed_branch in \
            origin/B-native-refactor \
            origin/codex/v0.2-beta; do
            if git show-ref --verify --quiet "refs/remotes/${reviewed_branch}" && \
              [[ "$(git rev-parse "${reviewed_branch}")" == "${tag_target_sha}" ]]; then
              reviewed_source=true
            fi
          done
          if [[ "${reviewed_source}" != "true" ]]; then
            echo "::error::标签提交不是默认/发行审阅分支头部，且未匹配受控发行 SHA。"
            exit 1
          fi

  device-e2e:
    name: 发行前未混淆 deviceTest 回归（API ${{ matrix.api-level }} / ${{ matrix.coverage-label }} / x86_64）
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 31
            e2e-scope: minimum
            coverage-label: 最低 SDK 核心可达性
          - api-level: 35
            e2e-scope: full
            coverage-label: 完整业务回归
          - api-level: 36
            e2e-scope: full
            coverage-label: 完整业务回归

    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 运行核心设备 E2E
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          NEXARA_DEVICE_E2E_SCOPE: ${{ matrix.e2e-scope }}
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: scripts/ci/android-device-core-e2e.sh

      - name: 上传设备 E2E 证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-device-e2e-api-${{ matrix.api-level }}-${{ github.run_attempt }}
          path: artifacts/android-device-api-${{ matrix.api-level }}-x86_64/
          if-no-files-found: warn
          retention-days: 14

  minified-blackbox:
    name: 发行前 Release 等价 minifiedTest 黑盒回归（API ${{ matrix.api-level }} / x86_64）
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
          - api-level: 36

    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 运行 Release 等价 minifiedTest 黑盒 smoke
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          ANDROID_MINIFIED_BLACKBOX_ARTIFACT_DIR: artifacts/android-minified-blackbox-api-${{ matrix.api-level }}-x86_64
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: scripts/ci/android-minified-blackbox-smoke.sh

      - name: 上传 Release 等价 minifiedTest 黑盒证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-minified-blackbox-api-${{ matrix.api-level }}-${{ github.run_attempt }}
          path: artifacts/android-minified-blackbox-api-${{ matrix.api-level }}-x86_64/
          if-no-files-found: warn
          retention-days: 14

  build-release:
    name: 验证并构建签名侧载 APK
    needs: [device-e2e, minified-blackbox]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release

    steps:
      - name: 检出已存在的发行标签
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 校验受保护环境变量
        env:
          NEXARA_KEYSTORE_BASE64: ${{ secrets.NEXARA_KEYSTORE_BASE64 }}
          NEXARA_STORE_PASSWORD: ${{ secrets.NEXARA_STORE_PASSWORD }}
          NEXARA_KEY_ALIAS: ${{ secrets.NEXARA_KEY_ALIAS }}
          NEXARA_KEY_PASSWORD: ${{ secrets.NEXARA_KEY_PASSWORD }}
          NEXARA_SIGNING_CERT_SHA256: ${{ vars.NEXARA_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEXARA_KEYSTORE_BASE64}" || { echo "::error::release environment 缺少 NEXARA_KEYSTORE_BASE64"; exit 1; }
          test -n "${NEXARA_STORE_PASSWORD}" || { echo "::error::release environment 缺少 NEXARA_STORE_PASSWORD"; exit 1; }
          test -n "${NEXARA_KEY_ALIAS}" || { echo "::error::release environment 缺少 NEXARA_KEY_ALIAS"; exit 1; }
          test -n "${NEXARA_KEY_PASSWORD}" || { echo "::error::release environment 缺少 NEXARA_KEY_PASSWORD"; exit 1; }
          test -n "${NEXARA_SIGNING_CERT_SHA256}" || { echo "::error::release environment 缺少公开变量 NEXARA_SIGNING_CERT_SHA256"; exit 1; }

      - name: 临时还原发行 keystore
        env:
          NEXARA_KEYSTORE_BASE64: ${{ secrets.NEXARA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["NEXARA_KEYSTORE_BASE64"]
          target = Path(os.environ["RUNNER_TEMP"]) / "nexara-release.jks"
          target.write_bytes(base64.b64decode(encoded, validate=True))
          if target.stat().st_size == 0:
              raise SystemExit("keystore 解码结果为空")
          PY

      - name: 执行全门禁并构建签名 APK
        working-directory: native-ui
        env:
          NEXARA_KEYSTORE_PATH: ${{ runner.temp }}/nexara-release.jks
          NEXARA_STORE_PASSWORD: ${{ secrets.NEXARA_STORE_PASSWORD }}
          NEXARA_KEY_ALIAS: ${{ secrets.NEXARA_KEY_ALIAS }}
          NEXARA_KEY_PASSWORD: ${{ secrets.NEXARA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'NEXARA_KEYSTORE_PATH' app/build.gradle.kts; then
            echo "::error::Phase4-A 尚未完成：Gradle 未接入 NEXARA_KEYSTORE_PATH 环境变量签名。"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --no-build-cache clean
          ./gradlew --no-daemon --stacktrace --no-build-cache \
            :app:validateDebugScreenshotTest
          ./gradlew --no-daemon --stacktrace --no-build-cache \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease

      - name: 删除临时 keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/nexara-release.jks"

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-reports-${{ github.run_attempt }}
          path: |
            native-ui/app/build/reports/tests/testDebugUnitTest/
            native-ui/app/build/test-results/testDebugUnitTest/
            native-ui/app/build/reports/lint-results-debug.html
            native-ui/app/build/reports/lint-results-debug.xml
            native-ui/app/build/reports/lint-results-debug.txt
            native-ui/app/build/reports/screenshotTest/preview/debug/
            native-ui/app/build/outputs/screenshotTest-results/preview/debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: 验证并整理发行 APK
        env:
          NEXARA_SIGNING_CERT_SHA256: ${{ vars.NEXARA_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-ui/app/build/outputs/apk/release/app-release.apk dist/nexara-v0.2-beta.apk
          python3 scripts/verify-release-apk.py \
            dist/nexara-v0.2-beta.apk \
            --expected-package com.promenar.nexara.native \
            --expected-version-code 2 \
            --expected-version-name 0.2-beta \
            --expected-cert-sha256 "${NEXARA_SIGNING_CERT_SHA256}" \
            --checksum-output dist/nexara-v0.2-beta.apk.sha256
          r8_output_dir="native-ui/app/build/outputs/mapping/release"
          mapping_path="native-ui/app/build/outputs/mapping/release/mapping.txt"
          test -s native-ui/app/build/outputs/mapping/release/mapping.txt || {
            echo "::error::R8 mapping.txt 缺失或为空，拒绝发布无法审计的混淆制品。"
            exit 1
          }
          mkdir -p dist/r8
          cp "${mapping_path}" dist/r8/mapping.txt
          for r8_evidence in seeds.txt usage.txt configuration.txt; do
            if [[ -f "${r8_output_dir}/${r8_evidence}" ]]; then
              cp "${r8_output_dir}/${r8_evidence}" "dist/r8/${r8_evidence}"
            else
              echo "::notice::AGP 未生成可选 R8 证据 ${r8_evidence}。"
            fi
          done

      - name: 上传已验签发行产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 3

  signed-apk-smoke:
    name: 签名 R8 APK 无密钥冷安装 smoke（API ${{ matrix.api-level }}）
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
          - api-level: 36

    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: 下载已验签发行产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist

      - name: 下载后先核对发行 APK 哈希
        working-directory: dist
        shell: bash
        run: sha256sum -c nexara-v0.2-beta.apk.sha256

      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 冷安装并核对 APK 身份、版本、证书与启动状态
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          NEXARA_SIGNING_CERT_SHA256: ${{ vars.NEXARA_SIGNING_CERT_SHA256 }}
          ANDROID_RELEASE_SMOKE_ARTIFACT_DIR: artifacts/release-smoke-api-${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: scripts/ci/android-release-apk-smoke.sh dist/nexara-v0.2-beta.apk

      - name: 上传冷安装证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-signed-apk-smoke-api-${{ matrix.api-level }}-${{ github.run_attempt }}
          path: artifacts/release-smoke-api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: 发布 GitHub prerelease
    needs: signed-apk-smoke
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.2-beta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出已存在的发行标签
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载已通过冷安装的发行产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist

      - name: 发布前再次核对发行 APK 哈希
        working-directory: dist
        shell: bash
        run: sha256sum -c nexara-v0.2-beta.apk.sha256

      - name: 发布前统一校验发布状态（验证账本 + 发布说明）
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/validate-release-readiness.py \
            docs/release/v0.2-beta-validation.md \
            docs/release/v0.2-beta.md

      - name: 幂等创建或恢复 GitHub prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2-beta"
          release_assets=(
            dist/nexara-v0.2-beta.apk
            dist/nexara-v0.2-beta.apk.sha256
          )

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --verify-tag \
              --draft \
              --prerelease \
              --latest=false \
              --title "Nexara v0.2-beta" \
              --notes-file docs/release/v0.2-beta.md
          fi

          read -r is_draft is_prerelease < <(
            gh release view "${tag}" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv'
          )
          if [[ "${is_prerelease}" != "true" ]] || \
            [[ "${is_draft}" != "true" && "${is_draft}" != "false" ]]; then
            echo "::error::既有 v0.2-beta Release 既不是 prerelease draft，也不是已发布的 prerelease。"
            exit 1
          fi

          existing_asset_names="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
          mkdir -p existing-release-assets
          for local_asset in "${release_assets[@]}"; do
            asset_name="$(basename "${local_asset}")"
            if grep -Fxq "${asset_name}" <<<"${existing_asset_names}"; then
              rm -f "existing-release-assets/${asset_name}"
              gh release download "${tag}" \
                --pattern "${asset_name}" \
                --dir existing-release-assets
              local_hash="$(sha256sum "${local_asset}" | cut -d ' ' -f 1)"
              remote_hash="$(sha256sum "existing-release-assets/${asset_name}" | cut -d ' ' -f 1)"
              if [[ "${local_hash}" != "${remote_hash}" ]]; then
                echo "::error::既有 Release 资产 ${asset_name} 哈希不同，拒绝静默覆盖。"
                exit 1
              fi
            else
              gh release upload "${tag}" "${local_asset}"
            fi
          done

          rm -rf existing-release-assets
          mkdir -p existing-release-assets
          for local_asset in "${release_assets[@]}"; do
            asset_name="$(basename "${local_asset}")"
            gh release download "${tag}" \
              --pattern "${asset_name}" \
              --dir existing-release-assets
            local_hash="$(sha256sum "${local_asset}" | cut -d ' ' -f 1)"
            remote_hash="$(sha256sum "existing-release-assets/${asset_name}" | cut -d ' ' -f 1)"
            if [[ "${local_hash}" != "${remote_hash}" ]]; then
              echo "::error::上传后 Release 资产 ${asset_name} 哈希校验失败。"
              exit 1
            fi
          done

          gh release edit "${tag}" \
            --draft=false \
            --prerelease \
            --latest=false \
            --title "Nexara v0.2-beta" \
            --notes-file docs/release/v0.2-beta.md

          read -r final_is_draft final_is_prerelease < <(
            gh release view "${tag}" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv'
          )
          if [[ "${final_is_draft}" != "false" || "${final_is_prerelease}" != "true" ]]; then
            echo "::error::资产验真后未能公开为 prerelease。"
            exit 1
          fi
