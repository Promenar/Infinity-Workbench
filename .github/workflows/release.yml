name: 验证或发布签名 APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  static-checks:
    name: 静态检查与工作流契约
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 运行静态检查
        run: bash scripts/ci/android-static-checks.sh

  validate-release-inputs:
    name: 校验版本、标签对象与提交来源
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version-name: ${{ steps.metadata.outputs.version-name }}
      version-code: ${{ steps.metadata.outputs.version-code }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: 检出候选提交或发行标签
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 读取源码版本与 CHANGELOG 发布说明
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release-metadata.py \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: 校验标签与源码版本一致且来自 main
        env:
          EXPECTED_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "main"
            echo "候选验证模式：构建并冷安装 ${EXPECTED_TAG} 签名 APK，但不发布。"
            exit 0
          fi

          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_TYPE}" = "tag"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与源码 versionName 推导的 ${EXPECTED_TAG} 不一致。"
            exit 1
          fi

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_object_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "${tag_object_type}" != "tag" ]]; then
            echo "::error::发行标签必须是 annotated tag，拒绝 lightweight tag。"
            exit 1
          fi
          tag_object_sha="$(git rev-parse "${tag_ref}")"
          tag_target_type="$(git cat-file -p "${tag_object_sha}" | sed -n 's/^type //p')"
          tag_target_sha="$(git rev-parse "${tag_ref}^{commit}")"
          if [[ "${tag_target_type}" != "commit" ]]; then
            echo "::error::发行标签必须直接指向 commit。"
            exit 1
          fi
          if [[ "${tag_target_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::检出提交与发行标签目标不一致。"
            exit 1
          fi
          test "${tag_target_sha}" = "${GITHUB_SHA}"

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "${tag_target_sha}" origin/main; then
            echo "::error::标签提交不在 main 历史中，拒绝发布。"
            exit 1
          fi

  device-e2e:
    name: 发行前未混淆 deviceTest 回归（API ${{ matrix.api-level }} / ${{ matrix.coverage-label }} / x86_64）
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 31
            e2e-scope: minimum
            coverage-label: 最低 SDK 核心可达性
          - api-level: 35
            e2e-scope: full
            coverage-label: 完整业务回归
          - api-level: 36
            e2e-scope: full
            coverage-label: 完整业务回归

    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Python 3.14（预编译打包 Python 字节码）
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go 1.27.1（编译内置 Tailscale）
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: native-ui/app/tailnet/go.sum

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 运行核心设备 E2E
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          INFINITY_DEVICE_E2E_SCOPE: ${{ matrix.e2e-scope }}
          # 托管模拟器无法完成 Tailscale 公网控制面的交互登录。
          INFINITY_E2E_TAILNET_CONTROL_PLANE: skip
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: scripts/ci/android-device-core-e2e.sh

      - name: 上传设备 E2E 证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-device-e2e-api-${{ matrix.api-level }}-${{ github.run_attempt }}
          path: artifacts/android-device-api-${{ matrix.api-level }}-x86_64/
          if-no-files-found: warn
          retention-days: 14

  minified-blackbox:
    name: 发行前 Release 等价 minifiedTest 黑盒回归（API ${{ matrix.api-level }} / x86_64）
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
          - api-level: 36

    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Python 3.14（预编译打包 Python 字节码）
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go 1.27.1（编译内置 Tailscale）
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: native-ui/app/tailnet/go.sum

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 运行 Release 等价 minifiedTest 黑盒 smoke
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          ANDROID_MINIFIED_BLACKBOX_ARTIFACT_DIR: artifacts/android-minified-blackbox-api-${{ matrix.api-level }}-x86_64
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: scripts/ci/android-minified-blackbox-smoke.sh

      - name: 上传 Release 等价 minifiedTest 黑盒证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-minified-blackbox-api-${{ matrix.api-level }}-${{ github.run_attempt }}
          path: artifacts/android-minified-blackbox-api-${{ matrix.api-level }}-x86_64/
          if-no-files-found: warn
          retention-days: 14

  build-release:
    name: 全门禁并构建签名 APK（侧载 + Play）
    needs: [validate-release-inputs, static-checks, device-e2e, minified-blackbox]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release

    steps:
      - name: 检出候选提交或发行标签
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Python 3.14（预编译打包 Python 字节码）
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go 1.27.1（编译内置 Tailscale）
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: native-ui/app/tailnet/go.sum

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 校验受保护环境变量
        env:
          INFINITY_KEYSTORE_BASE64: ${{ secrets.NEXARA_KEYSTORE_BASE64 }}
          INFINITY_STORE_PASSWORD: ${{ secrets.NEXARA_STORE_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.NEXARA_KEY_ALIAS }}
          INFINITY_KEY_PASSWORD: ${{ secrets.NEXARA_KEY_PASSWORD }}
          INFINITY_SIGNING_CERT_SHA256: ${{ vars.NEXARA_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INFINITY_KEYSTORE_BASE64}" || { echo "::error::release environment 缺少 NEXARA_KEYSTORE_BASE64"; exit 1; }
          test -n "${INFINITY_STORE_PASSWORD}" || { echo "::error::release environment 缺少 NEXARA_STORE_PASSWORD"; exit 1; }
          test -n "${INFINITY_KEY_ALIAS}" || { echo "::error::release environment 缺少 NEXARA_KEY_ALIAS"; exit 1; }
          test -n "${INFINITY_KEY_PASSWORD}" || { echo "::error::release environment 缺少 NEXARA_KEY_PASSWORD"; exit 1; }
          test -n "${INFINITY_SIGNING_CERT_SHA256}" || { echo "::error::release environment 缺少公开变量 NEXARA_SIGNING_CERT_SHA256"; exit 1; }

      - name: 临时还原发行 keystore
        env:
          INFINITY_KEYSTORE_BASE64: ${{ secrets.NEXARA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["INFINITY_KEYSTORE_BASE64"]
          target = Path(os.environ["RUNNER_TEMP"]) / "infinity-release.jks"
          target.write_bytes(base64.b64decode(encoded, validate=True))
          if target.stat().st_size == 0:
              raise SystemExit("keystore 解码结果为空")
          PY

      - name: 执行全门禁并构建签名 APK
        working-directory: native-ui
        env:
          INFINITY_KEYSTORE_PATH: ${{ runner.temp }}/infinity-release.jks
          INFINITY_STORE_PASSWORD: ${{ secrets.NEXARA_STORE_PASSWORD }}
          INFINITY_KEY_ALIAS: ${{ secrets.NEXARA_KEY_ALIAS }}
          INFINITY_KEY_PASSWORD: ${{ secrets.NEXARA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'INFINITY_KEYSTORE_PATH' app/build.gradle.kts; then
            echo "::error::Gradle 未接入 INFINITY_KEYSTORE_PATH 环境变量签名。"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --no-build-cache clean
          ./gradlew --no-daemon --stacktrace --no-build-cache \
            :app:validateSideloadDebugScreenshotTest
          ./gradlew --no-daemon --stacktrace --no-build-cache \
            :app:testSideloadDebugUnitTest \
            :app:lintSideloadDebug \
            :app:assembleSideloadDebug \
            :app:assemblePlayDebug \
            :app:testPlayDebugUnitTest \
            :app:assembleSideloadRelease \
            :app:assemblePlayRelease
          python3 ../scripts/ci/check-distribution-manifests.py --build-type release
          python3 ../scripts/ci/check-native-page-alignment.py --build-type release

      - name: 删除临时 keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/infinity-release.jks"

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-reports-${{ github.run_attempt }}
          path: |
            native-ui/app/build/reports/tests/testSideloadDebugUnitTest/
            native-ui/app/build/test-results/testSideloadDebugUnitTest/
            native-ui/app/build/reports/tests/testPlayDebugUnitTest/
            native-ui/app/build/test-results/testPlayDebugUnitTest/
            native-ui/app/build/reports/lint-results-sideloadDebug.html
            native-ui/app/build/reports/lint-results-sideloadDebug.xml
            native-ui/app/build/reports/lint-results-sideloadDebug.txt
            native-ui/app/build/reports/screenshotTest/preview/debug/sideload/
            native-ui/app/build/outputs/screenshotTest-results/preview/debug/sideload/
          if-no-files-found: ignore
          retention-days: 14

      - name: 验证并整理发行 APK
        env:
          INFINITY_SIGNING_CERT_SHA256: ${{ vars.NEXARA_SIGNING_CERT_SHA256 }}
          RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
          VERSION_NAME: ${{ needs.validate-release-inputs.outputs.version-name }}
          VERSION_CODE: ${{ needs.validate-release-inputs.outputs.version-code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-ui/app/build/outputs/apk/sideload/release/app-sideload-release.apk "dist/infinity-${RELEASE_TAG}.apk"
          cp native-ui/app/build/outputs/apk/play/release/app-play-release.apk "dist/infinity-${RELEASE_TAG}-play.apk"
          for distribution in sideload play; do
            suffix=""
            if [[ "${distribution}" == "play" ]]; then suffix="-play"; fi
            apk="dist/infinity-${RELEASE_TAG}${suffix}.apk"
            python3 scripts/verify-release-apk.py \
              "${apk}" \
              --expected-package com.promenar.infinity \
              --expected-version-code "${VERSION_CODE}" \
              --expected-version-name "${VERSION_NAME}" \
              --expected-cert-sha256 "${INFINITY_SIGNING_CERT_SHA256}" \
              --distribution "${distribution}" \
              --checksum-output "${apk}.sha256"
            r8_output_dir="native-ui/app/build/outputs/mapping/${distribution}Release"
            mapping_path="${r8_output_dir}/mapping.txt"
            test -s "${mapping_path}" || {
              echo "::error::${distribution} 的 R8 mapping.txt 缺失或为空。"
              exit 1
            }
            mkdir -p "dist/r8/${distribution}"
            cp "${mapping_path}" "dist/r8/${distribution}/mapping.txt"
            for r8_evidence in seeds.txt usage.txt configuration.txt; do
              if [[ -f "${r8_output_dir}/${r8_evidence}" ]]; then
                cp "${r8_output_dir}/${r8_evidence}" "dist/r8/${distribution}/${r8_evidence}"
              else
                echo "::notice::AGP 未生成可选 R8 证据 ${distribution}/${r8_evidence}。"
              fi
            done
          done

      - name: 上传已验签发行产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 3

  signed-apk-smoke:
    name: 签名 R8 APK 无密钥冷安装 smoke（${{ matrix.distribution }} / API ${{ matrix.api-level }}）
    needs: [validate-release-inputs, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            distribution: sideload
            apk-suffix: ""
          - api-level: 36
            distribution: sideload
            apk-suffix: ""
          - api-level: 35
            distribution: play
            apk-suffix: "-play"
          - api-level: 36
            distribution: play
            apk-suffix: "-play"
    env:
      APK_NAME: infinity-${{ needs.validate-release-inputs.outputs.tag }}${{ matrix.apk-suffix }}.apk

    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Python 3.14（预编译打包 Python 字节码）
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go 1.27.1（编译内置 Tailscale）
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: native-ui/app/tailnet/go.sum

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: 下载已验签发行产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist

      - name: 下载后先核对发行 APK 哈希
        working-directory: dist
        shell: bash
        run: sha256sum -c "${APK_NAME}.sha256"

      - name: 启用 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 冷安装并核对 APK 身份、版本、证书与启动状态
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          INFINITY_SIGNING_CERT_SHA256: ${{ vars.NEXARA_SIGNING_CERT_SHA256 }}
          INFINITY_EXPECTED_VERSION_CODE: ${{ needs.validate-release-inputs.outputs.version-code }}
          INFINITY_EXPECTED_VERSION_NAME: ${{ needs.validate-release-inputs.outputs.version-name }}
          ANDROID_RELEASE_SMOKE_ARTIFACT_DIR: artifacts/release-smoke-${{ matrix.distribution }}-api-${{ matrix.api-level }}
          INFINITY_EXPECTED_DISTRIBUTION: ${{ matrix.distribution }}
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: scripts/ci/android-release-apk-smoke.sh "dist/${APK_NAME}"

      - name: 上传冷安装证据
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-signed-apk-smoke-${{ matrix.distribution }}-api-${{ matrix.api-level }}-${{ github.run_attempt }}
          path: artifacts/release-smoke-${{ matrix.distribution }}-api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: 发布 GitHub Release
    needs: [validate-release-inputs, signed-apk-smoke]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-release-inputs.outputs.tag }}
      PRERELEASE: ${{ needs.validate-release-inputs.outputs.prerelease }}

    steps:
      - name: 检出发行标签
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 下载已通过冷安装的发行产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-apk-${{ github.run_id }}
          path: dist

      - name: 发布前再次核对发行 APK 哈希
        working-directory: dist
        shell: bash
        run: sha256sum -c "infinity-${RELEASE_TAG}.apk.sha256" "infinity-${RELEASE_TAG}-play.apk.sha256"

      - name: 由 CHANGELOG 生成发布说明
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release-metadata.py --notes release-notes.md >/dev/null
          {
            echo
            echo "### 安装包"
            echo
            echo "| 文件 | 渠道 | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| \`infinity-${RELEASE_TAG}.apk\` | 侧载（含内置 Linux 与设备文件访问） | \`$(cut -d ' ' -f 1 "dist/infinity-${RELEASE_TAG}.apk.sha256")\` |"
            echo "| \`infinity-${RELEASE_TAG}-play.apk\` | Play（不含内置 Linux 与设备文件访问） | \`$(cut -d ' ' -f 1 "dist/infinity-${RELEASE_TAG}-play.apk.sha256")\` |"
            echo
            echo "两个渠道使用同一应用 ID 与签名，不能并列安装。"
          } >> release-notes.md

      - name: 幂等创建或恢复 GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          title="Infinity Workbench ${tag}"
          if [[ "${PRERELEASE}" == "true" ]]; then latest=false; else latest=true; fi
          release_assets=(
            "dist/infinity-${tag}.apk"
            "dist/infinity-${tag}.apk.sha256"
            "dist/infinity-${tag}-play.apk"
            "dist/infinity-${tag}-play.apk.sha256"
          )

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --verify-tag \
              --draft \
              --prerelease="${PRERELEASE}" \
              --latest="${latest}" \
              --title "${title}" \
              --notes-file release-notes.md
          fi

          read -r is_draft is_prerelease < <(
            gh release view "${tag}" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv'
          )
          if [[ "${is_prerelease}" != "${PRERELEASE}" ]] || \
            [[ "${is_draft}" != "true" && "${is_draft}" != "false" ]]; then
            echo "::error::既有 ${tag} Release 的 prerelease 状态与版本名不符。"
            exit 1
          fi

          existing_asset_names="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
          mkdir -p existing-release-assets
          for local_asset in "${release_assets[@]}"; do
            asset_name="$(basename "${local_asset}")"
            if grep -Fxq "${asset_name}" <<<"${existing_asset_names}"; then
              rm -f "existing-release-assets/${asset_name}"
              gh release download "${tag}" \
                --pattern "${asset_name}" \
                --dir existing-release-assets
              local_hash="$(sha256sum "${local_asset}" | cut -d ' ' -f 1)"
              remote_hash="$(sha256sum "existing-release-assets/${asset_name}" | cut -d ' ' -f 1)"
              if [[ "${local_hash}" != "${remote_hash}" ]]; then
                echo "::error::既有 Release 资产 ${asset_name} 哈希不同，拒绝静默覆盖。"
                exit 1
              fi
            else
              gh release upload "${tag}" "${local_asset}"
            fi
          done

          rm -rf existing-release-assets
          mkdir -p existing-release-assets
          for local_asset in "${release_assets[@]}"; do
            asset_name="$(basename "${local_asset}")"
            gh release download "${tag}" \
              --pattern "${asset_name}" \
              --dir existing-release-assets
            local_hash="$(sha256sum "${local_asset}" | cut -d ' ' -f 1)"
            remote_hash="$(sha256sum "existing-release-assets/${asset_name}" | cut -d ' ' -f 1)"
            if [[ "${local_hash}" != "${remote_hash}" ]]; then
              echo "::error::上传后 Release 资产 ${asset_name} 哈希校验失败。"
              exit 1
            fi
          done

          gh release edit "${tag}" \
            --draft=false \
            --prerelease="${PRERELEASE}" \
            --latest="${latest}" \
            --title "${title}" \
            --notes-file release-notes.md

          read -r final_is_draft final_is_prerelease < <(
            gh release view "${tag}" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv'
          )
          if [[ "${final_is_draft}" != "false" || "${final_is_prerelease}" != "${PRERELEASE}" ]]; then
            echo "::error::资产验真后未能按版本名公开 Release。"
            exit 1
          fi
