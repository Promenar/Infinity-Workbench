name: Android 截图诊断

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-diagnostics:
    name: 截图回归与差异证据
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 配置 JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: 配置 Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: native-ui/app/tailnet/go.sum

      - name: 配置 Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          dependency-graph: disabled

      - name: 执行发行截图门禁
        working-directory: native-ui
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --no-build-cache clean
          ./gradlew --no-daemon --stacktrace --no-build-cache :app:validateSideloadDebugScreenshotTest

      - name: 保留截图报告与参考图
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-diagnostics-${{ github.run_attempt }}
          path: |
            native-ui/app/src/screenshotTestDebug/reference/
            native-ui/app/build/reports/screenshotTest/preview/debug/sideload/
            native-ui/app/build/outputs/screenshotTest-results/preview/debug/sideload/
          if-no-files-found: error
          retention-days: 14
